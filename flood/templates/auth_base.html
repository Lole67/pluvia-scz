<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <title>{% block title %}Mi cuenta{% endblock %} · Pluvia SCZ</title>
  <link rel="stylesheet" href="/static/style.css"><link rel="stylesheet" href="/static/auth.css">
</head>
<body class="account-page">
<header><div><span class="eyebrow">SANTA CRUZ · ZONA PILOTO</span><h1>Pluvia SCZ</h1></div>
{% if g.user %}<nav class="account-nav" aria-label="Cuenta">
  <a href="/">Simulador</a>{% if g.user.role == 'admin' %}<a href="/admin/users">Usuarios</a>{% endif %}
  <a href="/account">Mi cuenta</a>
  <form action="/logout" method="post"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}"><button type="submit">Salir</button></form>
</nav>{% endif %}</header>
<main class="account-main {% block width %}{% endblock %}">
{% if error %}<p class="form-error" role="alert">{{ error }}</p>{% endif %}
{% block content %}{% endblock %}
</main>
<footer>Modelo experimental. No es un pronóstico ni una herramienta de alertas.</footer>
</body></html>
